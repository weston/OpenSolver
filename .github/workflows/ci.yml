name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual full run of every job on any branch (Actions tab -> CI -> Run workflow).
  workflow_dispatch:

# Billing (#97): this is a private repo, so Actions minutes are multiplied per OS (Linux 1x,
# Windows 2x, macOS 10x). The 1x Linux jobs run on every PR; macOS and native Windows run only
# on pushes to main and on manual runs. Agents verify macOS locally before merging.

# A new push to a pull request supersedes the previous run. Pushes to main are not
# cancelled: each commit there is something we may later want to point at, and two merges
# landing seconds apart would otherwise leave the first one with no completed run.
# PR runs and main runs are already in separate groups (refs/pull/N/merge vs
# refs/heads/main), so they never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One compiler failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # An explicit list rather than a cross product: g++ on macOS is a clang shim, so
        # a full os x compiler matrix would add a job that tests nothing new. Linux x86 covers
        # -march=native; the macos job below covers -mcpu=native.
        include:
          - name: Linux (g++)
            os: ubuntu-latest
            cxx: g++
            apt: g++ zlib1g-dev
          - name: Linux (clang++)
            os: ubuntu-latest
            cxx: clang++
            apt: clang zlib1g-dev
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # zlib is the only dependency; macOS ships it.
      - name: Install packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Toolchain
        run: |
          "$CXX" --version
          "$CXX" -dumpmachine
          python3 --version
          getconf _NPROCESSORS_ONLN

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      # Runs test_eval (all 133M 7-card hands), test_range, test_categories, test_solver,
      # test_tree_builder.py and tests/test_upi.py. The 25bb fixture section of test_upi.py
      # is behind --big (make test-big) and stays out of CI: it needs several GB of RAM and
      # minutes of solving, which a hosted runner does not have.
      - name: Unit and end-to-end tests
        run: make test

  # Same steps as build-and-test, split out so it can be gated (a job-level `if` cannot see
  # the matrix). Covers the Apple clang / -mcpu=native path.
  macos:
    name: macOS (Apple clang)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          "$CXX" --version
          "$CXX" -dumpmachine
          python3 --version
          getconf _NPROCESSORS_ONLN

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Unit and end-to-end tests
        run: make test

  # Native Python is essential here: its subprocess/path behavior must match
  # Windows clients, rather than running the tests under MSYS POSIX emulation.
  windows-native:
    name: Windows (native UCRT64)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python

      - name: Toolchain
        run: |
          "$CXX" --version
          "$CXX" -dumpmachine
          python3 --version
          python3 -c 'import sys; assert sys.platform == "win32", sys.platform'

      - name: Build
        run: make -j"$(nproc)"

      # Same suite as macOS/Linux, including native subprocess and save/load
      # behavior. Only the opt-in 25bb fixture stays out, as on every CI runner.
      - name: Unit and end-to-end tests
        run: make test

  # Keep the quick cross-build guard in addition to the native behavior tests.
  windows-cross:
    name: Windows (mingw-w64 cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Debian's default x86_64-w64-mingw32-g++ uses the win32 thread model, where
      # std::thread and std::mutex are unavailable; src/parallel.cpp needs them. The -posix
      # alternative links winpthreads and provides them.
      WIN_CXX: x86_64-w64-mingw32-g++-posix
    steps:
      - uses: actions/checkout@v4

      # libz-mingw-w64-dev drops zlib.h and a MinGW libz.a into the cross prefix that the
      # compiler already searches, so ZLIB_DIR is not needed here.
      - name: Install mingw-w64 and zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 libz-mingw-w64-dev

      - name: Toolchain
        run: |
          "$WIN_CXX" --version
          "$WIN_CXX" -dumpmachine
          "$WIN_CXX" -v 2>&1 | grep -i 'thread model' || true

      - name: Cross-build solver.exe
        run: make windows -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Check the artifact is a Windows binary
        run: |
          test -f build/win/solver.exe
          file build/win/solver.exe
          file build/win/solver.exe | grep -q 'PE32+ executable'
